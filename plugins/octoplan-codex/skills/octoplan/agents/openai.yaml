interface:
  display_name: "Octoplan for Codex"
  short_description: "Turn a brief into governed, supervised delivery"
  default_prompt: "Use $octoplan to clarify my request, show the creation brief and checkpoints, then create and supervise the plan after approval."

dependencies:
  tools:
    - type: "mcp"
      value: "octopad"
      description: "Read and update Octopad work streams, tasks, decisions, and plans"
      transport: "streamable_http"
      url: "https://mcp.octopad.app/mcp"
