interface:
  display_name: "Octoplan for Codex"
  short_description: "Turn a brief into governed, supervised delivery"
  default_prompt: "Use $octoplan to clarify this request, show the creation brief and recommended review cadence, then create and supervise the governed Octopad plan after I approve it."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "octopad"
      description: "Read and update Octopad work streams, tasks, decisions, and plans"
      transport: "streamable_http"
      url: "https://mcp.octopad.app/mcp"
