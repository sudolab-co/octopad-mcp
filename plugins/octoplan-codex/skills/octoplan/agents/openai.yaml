interface:
  display_name: "Octoplan for Codex"
  short_description: "Confirm, plan, and supervise governed delivery"
  default_prompt: "Use $octoplan to confirm my Brief, show the Plan and interruption choice, then supervise authorized Delivery."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "octopad"
      description: "Read and update Octopad work streams, tasks, decisions, and plans"
      transport: "streamable_http"
      url: "https://mcp.octopad.app/mcp"
