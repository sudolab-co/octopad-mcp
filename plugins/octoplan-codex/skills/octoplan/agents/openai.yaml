interface:
  display_name: "Octoplan for Codex"
  short_description: "Calibrate, challenge, and deliver governed plans"
  default_prompt: "Use $octoplan to clarify, show the brief and checkpoints, then create and supervise the plan within my authorized scope."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "octopad"
      description: "Read and update Octopad work streams, tasks, decisions, and plans"
      transport: "streamable_http"
      url: "https://mcp.octopad.app/mcp"
