interface:
  display_name: "Octoplan for Codex"
  short_description: "Turn ideas into governed plans and approved execution"
  default_prompt: "Use $octoplan to turn this idea into a governed Octopad plan, surfacing the plan-scoped Codex create/message/archive grant in the first brief."

policy:
  allow_implicit_invocation: false

dependencies:
  tools:
    - type: "mcp"
      value: "octopad"
      description: "Read and update Octopad work streams, tasks, decisions, and plans"
      transport: "streamable_http"
      url: "https://mcp.octopad.app/mcp"
