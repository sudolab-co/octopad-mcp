interface:
  display_name: "Octoplan for Codex"
  short_description: "Plan Octopad streams and orchestrate approved execution"
  default_prompt: "Use $octoplan to plan an Octopad work stream."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "octopad"
      description: "Read and update Octopad work streams, tasks, decisions, and plans"
      transport: "streamable_http"
      url: "https://mcp.octopad.app/mcp"
